name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # deploy-pages lists artifacts once. Wait until the ID from this upload
      # is actually in that list, then let the official publisher use it.
      - name: Wait for the uploaded artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = String(process.env.ARTIFACT_ID || '')
            if (!artifactId) {
              core.setFailed('upload-pages-artifact did not return artifact_id')
              return
            }
            const started = Date.now()
            while (Date.now() - started < 180000) {
              const listed = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              })
              const found = (listed.data.artifacts || []).some(artifact => String(artifact.id) === artifactId)
              if (found) {
                core.info(`Artifact ${artifactId} is listed`)
                return
              }
              core.info(`Artifact ${artifactId} is not listed yet`)
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            core.setFailed(`Artifact ${artifactId} was not listed within 3 minutes`)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
